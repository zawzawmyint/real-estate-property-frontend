# Standalone frontend entry point; also usable from the parent workspace.
[mcp_servers.next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@0.4.0"]
startup_timeout_sec = 60
tool_timeout_sec = 90
env = { NEXT_TELEMETRY_DISABLED = "1", SystemRoot = 'C:\Windows', PROGRAMFILES = 'C:\Program Files' }
